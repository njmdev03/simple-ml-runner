experiment:
  name: gru_mt_pretrained

task:
  name: machine_translation

model:
  name: GRU_Seq2Seq
  params:
    emb_dim: 50
    hid_dim: 256
    n_layers: 2
    embedding_name: "glove-wiki-gigaword-50"

dataset:
  name: Multi30k
  params:
    max_len: 50

dataloader:
  batch_size: 64
  shuffle: false

loss:
  name: cross_entropy

optimizer:
  name: adam
  lr: 0.001

evaluation:
  batch_size: 128
  metrics:
    - perplexity
    - bleu

training:
  epochs: 5

logging:
  output_dir: "logs/{experiment_name}"
  log_file: "run_{timestamp}.log"

extensions:
  checkpoints:
    enabled: true
    directory: "checkpoints/{experiment_name}"
  profiling:
    enabled: true
  metadata:
    enabled: true
    output_dir: "results/{experiment_name}"
  tensorboard:
    enabled: true
    log_dir: "tensorboard/{experiment_name}"

exports:
  plot:
    plots:
      - loss
      - perplexity
      - bleu
      - epoch_train_duration,epoch_eval_duration
    output: "plots/{experiment_name}"
    metadata_dir: "checkpoints/{experiment_name}"
