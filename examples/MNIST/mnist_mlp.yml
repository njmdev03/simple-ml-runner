experiment:
  name: mnist_mlp

device: auto

dataset:
  name: MNIST
  params:
    root: ./data
    download: true

dataloader:
  batch_size: 64
  shuffle: true

model:
  name: MLP
  params:
    input_dim: 784
    layers: [256, 128]
    output_dim: 10

loss:
  name: cross_entropy

optimizer:
  name: adam
  lr: 0.001

metrics:
  - accuracy

training:
  enabled: true
  epochs: 1

evaluation:
  enabled: true
  eval_checkpoints: true
  eval_frequency: 1

logging:
  output_dir: "results/{experiment_name}"
  log_file: "run_{timestamp}.log"
  level: INFO

profile: true

extensions:
  checkpoints:
    directory: "checkpoints/{experiment_name}/{date:%Y%m%d}"
    name_template: "model_epoch_{epoch}.pt"
    frequency: 1
