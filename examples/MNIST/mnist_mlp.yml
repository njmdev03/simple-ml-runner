experiment:
  name: mnist_mlp

device: auto

dataset:
  MNIST:
    root: ./data
    download: true

dataloader:
  batch_size: 64
  shuffle: true

model:
  MLP:
    input_dim: 784
    layers: [256, 128]
    output_dim: 10

loss:
  cross_entropy: {}

optimizer:
  adam:
    lr: 0.001

metrics:
  - accuracy

training:
  epochs: 5

evaluation:
  eval_during_training: true
  eval_checkpoints: true
  eval_frequency: 1

checkpoint:
  directory: checkpoints/
  name: mnist_mlp_epoch_{epoch}
  frequency: 1

profile: true
