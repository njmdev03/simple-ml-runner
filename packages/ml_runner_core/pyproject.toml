[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ml-runner-core"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["torch"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'win32'"},
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
